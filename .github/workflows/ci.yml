name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.4'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - run: go mod download
      - run: go run github.com/a-h/templ/cmd/templ@v0.3.960 generate
      - run: git diff --exit-code -- internal/pages/page_templ.go
      - run: go test ./...
      - run: go vet ./...
      - run: go run ./cmd/build
      - run: npm run css
      - run: npm run fonts
      - run: npm run check:links
